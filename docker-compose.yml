services:
  n-file-system:
    build:
      context: .
    image: n-file-system:latest
    container_name: n-file-system
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-6001}:${PORT:-6001}"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
