services:
  n-file-system:
    image: n-file-system:latest
    container_name: n-file-system
    restart: unless-stopped
    ports:
      - "${PORT:-6001}:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOKEN_EXPIRES_IN: ${TOKEN_EXPIRES_IN:-30d}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-false}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
