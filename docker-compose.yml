services:
  n-file-system:
    image: n-file-system:latest
    container_name: n-file-system
    restart: unless-stopped
    ports:
      - "${PORT:-6001}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      TOKEN_EXPIRES_IN: ${TOKEN_EXPIRES_IN:-30d}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-5000}
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-20}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-52428800}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1048576000}
      USER_QUOTA_BYTES: ${USER_QUOTA_BYTES:-10737418240}
      MAX_UPLOAD_CONCURRENCY: ${MAX_UPLOAD_CONCURRENCY:-2}
      MIN_FREE_BYTES: ${MIN_FREE_BYTES:-268435456}
      DRIVE_PAGE_SIZE: ${DRIVE_PAGE_SIZE:-200}
      MAX_FOLDER_DEPTH: ${MAX_FOLDER_DEPTH:-128}
      STALE_TEMP_MAX_AGE_MS: ${STALE_TEMP_MAX_AGE_MS:-86400000}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AUTH_RATE_WINDOW_MS: ${AUTH_RATE_WINDOW_MS:-60000}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
