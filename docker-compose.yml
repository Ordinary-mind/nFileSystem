services:
  nfilesystem:
    image: nfilesystem:latest
    container_name: nfilesystem
    restart: unless-stopped
    ports:
      - "6001:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOKEN_EXPIRES_IN: ${TOKEN_EXPIRES_IN:-30d}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-false}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
