<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件管理系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 登录/注册页 -->
  <div id="auth-page" class="page">
    <div class="auth-container">
      <h1>📁 文件管理系统</h1>
      <div class="auth-tabs">
        <button class="tab active" data-tab="login">登录</button>
        <button class="tab" data-tab="register" id="register-tab">注册</button>
      </div>
      <form id="login-form" class="auth-form">
        <input type="text" id="login-name" placeholder="用户名" required autocomplete="username">
        <input type="password" id="login-password" placeholder="密码" required autocomplete="current-password">
        <button type="submit">登录</button>
      </form>
      <form id="register-form" class="auth-form hidden">
        <input type="text" id="reg-name" placeholder="用户名" required autocomplete="username">
        <input type="password" id="reg-password" placeholder="密码" required autocomplete="new-password">
        <input type="password" id="reg-password2" placeholder="确认密码" required autocomplete="new-password">
        <button type="submit">注册</button>
      </form>
      <p id="auth-message" class="message"></p>
    </div>
  </div>

  <!-- 文件管理页 -->
  <div id="file-page" class="page hidden">
    <header class="toolbar">
      <div class="toolbar-left">
        <span class="logo">📁 文件管理器</span>
        <span id="user-info" class="user-info"></span>
      </div>
      <div class="toolbar-right">
        <input type="text" id="search-input" placeholder="搜索..." class="search-input">
        <button id="new-folder-btn" class="btn-toolbar">📂 新建文件夹</button>
        <label class="upload-btn" for="file-input">⬆ 上传文件</label>
        <input type="file" id="file-input" multiple hidden>
        <button id="logout-btn" class="btn-logout">退出</button>
      </div>
    </header>

    <!-- 面包屑导航 -->
    <div class="breadcrumb" id="breadcrumb">
      <span class="breadcrumb-item" data-id="">🏠 根目录</span>
    </div>

    <!-- 文件列表头 -->
    <div class="file-header">
      <div class="col-name">名称</div>
      <div class="col-size">大小</div>
      <div class="col-type">类型</div>
      <div class="col-date">时间</div>
      <div class="col-action">操作</div>
    </div>

    <div id="file-list" class="file-list"></div>

    <!-- 上传进度 -->
    <div id="upload-overlay" class="upload-overlay hidden">
      <div class="upload-dialog">
        <h3>正在上传...</h3>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <p id="upload-status">准备中...</p>
      </div>
    </div>

    <!-- 文件预览 -->
    <div id="preview-overlay" class="preview-overlay hidden">
      <div class="preview-dialog">
        <div class="preview-header">
          <span id="preview-title">预览</span>
          <button id="preview-close" class="preview-close">✕</button>
        </div>
        <div id="preview-content" class="preview-content"></div>
      </div>
    </div>

    <!-- 右键菜单 -->
    <div id="context-menu" class="context-menu hidden">
      <div class="menu-item" data-action="rename">✏️ 重命名</div>
      <div class="menu-item" data-action="move">📦 移动到...</div>
      <div class="menu-item" data-action="delete">🗑️ 删除</div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/lib/spark-md5.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
